name: Android Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-release-bundle:
    name: Build Release AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Prepare Signing Keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 found in secrets. Decoding into release-keystore.jks..."
            echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            echo "Keystore decoded successfully."
          else
            echo "KEYSTORE_BASE64 secret is missing. Generating on-the-fly self-signed release keystore using keytool..."
            keytool -genkeypair -v \
              -keystore release-keystore.jks \
              -alias "${KEY_ALIAS}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${KEYSTORE_PASSWORD}" \
              -keypass "${KEY_PASSWORD}" \
              -dname "CN=Android Release, OU=Release, O=PAK E DRIVE, L=Islamabad, ST=Islamabad, C=PK"
            echo "Generated self-signed release keystore (Alias: ${KEY_ALIAS}) successfully."
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'MyPassword123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'MyPassword123' }}

      - name: Build Release Bundle (.aab)
        run: ./gradlew bundleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'MyPassword123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'MyPassword123' }}
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
