name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "Google Play versionCode"
        required: true
        default: "4"
        type: string
      versionName:
        description: "Google Play versionName"
        required: true
        default: "1.0.2"
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-build
  cancel-in-progress: true

jobs:
  build-release-bundle:
    name: Build Signed Production AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
          add-job-summary: "on-failure"

      - name: Grant execute permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Validate Required Secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Checking required production signing secrets..."

          MISSING=""

          [ -n "${KEYSTORE_BASE64:-}" ] || MISSING="${MISSING} KEYSTORE_BASE64"
          [ -n "${KEYSTORE_PASSWORD:-}" ] || MISSING="${MISSING} KEYSTORE_PASSWORD"
          [ -n "${KEY_ALIAS:-}" ] || MISSING="${MISSING} KEY_ALIAS"
          [ -n "${KEY_PASSWORD:-}" ] || MISSING="${MISSING} KEY_PASSWORD"

          if [ -n "$MISSING" ]; then
            echo "::error::Missing required GitHub secret(s):$MISSING"
            echo "::error::Configure them under Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "All required signing secrets are present."

      - name: Decode Production Upload Keystore
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/pakedrive-upload.jks"

          echo "Decoding production upload keystore into runner temp directory..."

          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode > "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi

          echo "Validating keystore and alias..."

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass:env KEYSTORE_PASSWORD \
            -alias "$KEY_ALIAS" \
            >/tmp/keystore-list.txt 2>&1

          keytool -exportcert \
            -keystore "$KEYSTORE_PATH" \
            -alias "$KEY_ALIAS" \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -file "$RUNNER_TEMP/upload-cert.pem" \
            >/dev/null 2>&1

          echo "Keystore validation successful."

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Verify Upload Key Certificate
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "=== Upload Certificate ==="

          keytool -list -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass:env KEYSTORE_PASSWORD \
            -alias "$KEY_ALIAS" \
            | grep -E "Owner:|Issuer:|Valid from:|SHA256:|SHA1:" || true

          echo "========================="

      - name: Run Unit Tests
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew testDebugUnitTest \
            --stacktrace \
            --no-daemon

      - name: Build Production AAB
        shell: bash
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.versionCode }}
          VERSION_NAME: ${{ inputs.versionName }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          set -euo pipefail

          echo "Building production release..."

          ./gradlew bundleRelease \
            --stacktrace \
            --no-daemon

      - name: Verify AAB Exists
        shell: bash
        run: |
          set -euo pipefail

          AAB_FILE="$(find app/build/outputs/bundle/release \
            -type f \
            -name "*.aab" \
            -print -quit)"

          if [ -z "$AAB_FILE" ]; then
            echo "::error::Production AAB was not generated."
            exit 1
          fi

          echo "AAB found:"
          echo "$AAB_FILE"

          SIZE="$(stat -c%s "$AAB_FILE")"

          if [ "$SIZE" -le 0 ]; then
            echo "::error::Generated AAB is empty."
            exit 1
          fi

          echo "AAB size: $SIZE bytes"

      - name: Verify AAB Signature
        shell: bash
        run: |
          set -euo pipefail

          AAB_FILE="$(find app/build/outputs/bundle/release \
            -type f \
            -name "*.aab" \
            -print -quit)"

          echo "Verifying AAB signature..."

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB_FILE" \
            > "$RUNNER_TEMP/jarsigner.log" 2>&1

          if ! grep -q "jar verified" "$RUNNER_TEMP/jarsigner.log"; then
            echo "::error::AAB signature verification failed."

            tail -n 40 "$RUNNER_TEMP/jarsigner.log"

            exit 1
          fi

          echo "AAB signature verification successful."

      - name: Display AAB Certificate Fingerprint
        shell: bash
        run: |
          set -euo pipefail

          AAB_FILE="$(find app/build/outputs/bundle/release \
            -type f \
            -name "*.aab" \
            -print -quit)"

          echo "=== AAB Signing Certificate ==="

          keytool -printcert \
            -jarfile "$AAB_FILE" \
            | grep -E "Owner:|Issuer:|Valid from:|SHA256:|SHA1:" || true

          echo "================================"

      - name: Upload Production AAB
        uses: actions/upload-artifact@v4
        with:
          name: pak-e-drive-production-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup Sensitive Files
        if: always()
        shell: bash
        run: |
          set +e

          if [ -n "${KEYSTORE_PATH:-}" ] && [ -f "$KEYSTORE_PATH" ]; then
            rm -f "$KEYSTORE_PATH"
          fi

          rm -f "$RUNNER_TEMP/upload-cert.pem"
          rm -f "$RUNNER_TEMP/jarsigner.log"

          echo "Temporary signing files removed."
